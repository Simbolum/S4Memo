<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims 4 Családfa & Királyi Krónika</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-solid: #ffffff;
            --text-color: #3d322c;
            --subtext-color: #7d6b63;
            --border-color: #e6d5bc;
            --accent-color: #059669; /* emerald-600 */
            --accent-hover: #047857; /* emerald-700 */
            --active-glow: rgba(5, 150, 105, 0.25);
            --shadow-color: rgba(61, 50, 44, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.8);
            --input-bg: #fdfbf7;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        h1, h2, h3, .font-sims { 
            font-family: 'Playfair Display', serif; 
        }

        /* Plumbob animáció */
        @keyframes plumbobFloat {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        .plumbob {
            width: 14px; height: 22px; 
            background: linear-gradient(135deg, #059669 0%, #34d399 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); 
            display: inline-block;
            filter: drop-shadow(0 0 6px rgba(5, 150, 105, 0.5));
            animation: plumbobFloat 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-200 selection:text-emerald-900">

    <!-- BEJELENTKEZÉS / REGISZTRÁCIÓS NÉZET -->
    <div id="authView" class="fixed inset-0 bg-[#f4ebd9]/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-[#e6d5bc] rounded-3xl p-8 max-w-md w-full shadow-xl shadow-orange-950/5">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 mb-2 font-bold text-xl shadow-inner">♦</div>
                <h1 id="authTitle" class="text-2xl font-bold font-sims text-[#3d322c]">Bejelentkezés</h1>
                <p id="authSubtitle" class="text-xs text-[#7d6b63] mt-1">Lépj be a dinasztia kezeléséhez</p>
            </div>
            
            <div id="authError" class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-2xl hidden"></div>
            <div id="authSuccess" class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-2xl hidden"></div>

            <!-- Bejelentkezési űrlap -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1.5">Email cím</label>
                    <input type="email" id="loginEmail" required class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-3 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1.5">Jelszó</label>
                    <input type="password" id="loginPassword" required class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-3 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl transition shadow-md shadow-emerald-600/20 text-sm cursor-pointer">Bejelentkezés</button>
                
                <div class="text-center pt-2">
                    <button type="button" onclick="switchAuthMode('register')" class="text-xs text-[#8c786d] hover:text-emerald-700 underline cursor-pointer font-medium">Még nincs fiókom, regisztrálok</button>
                </div>
            </form>

            <!-- Regisztrációs űrlap (alapból rejtett) -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1.5">Felhasználónév</label>
                    <input type="text" id="regUsername" required placeholder="pl. BellaGoth" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-3 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1.5">Email cím</label>
                    <input type="email" id="regEmail" required class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-3 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1.5">Jelszó (min. 6 karakter)</label>
                    <input type="password" id="regPassword" required minlength="6" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-3 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-2xl transition shadow-md shadow-emerald-600/20 text-sm cursor-pointer">Regisztráció</button>
                
                <div class="text-center pt-2">
                    <button type="button" onclick="switchAuthMode('login')" class="text-xs text-[#8c786d] hover:text-emerald-700 underline cursor-pointer font-medium">Már van fiókom, bejelentkezem</button>
                </div>
            </form>
            
            <div class="mt-6 border-t border-[#f0e6d2] pt-4 text-center">
                <button onclick="openSettings()" class="text-xs text-[#8c786d] hover:text-emerald-700 underline cursor-pointer font-medium">⚙️ Supabase Kulcsok Beállítása</button>
            </div>
        </div>
    </div>

    <!-- FŐ OLDAL -->
    <div id="mainView" class="hidden flex-1 flex flex-col">
        <!-- Fejléc -->
        <header class="bg-white/80 backdrop-blur border-b border-[#f0e6d2] py-4 px-8 sticky top-0 z-40 shadow-sm">
            <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-lg shadow-inner"><span class="plumbob" style="width:10px; height:16px;"></span></div>
                    <div>
                        <h1 class="text-xl font-bold font-sims text-[#3d322c]">Sims Családi Archívum</h1>
                        <p class="text-[#8c786d] text-xs font-medium">Dinasztia Krónika</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Profil / Felhasználónév kijelzés -->
                    <div class="flex items-center gap-2 bg-[#fdfbf7] border border-[#e6d5bc] px-4 py-2 rounded-2xl shadow-inner">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span id="userProfileDisplay" class="text-xs font-bold text-[#3d322c]">Felhasználó</span>
                    </div>
                    <button onclick="logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 px-4 py-2 rounded-2xl text-xs font-semibold transition cursor-pointer">Kijelentkezés</button>
                </div>
            </div>
        </header>

        <!-- Tartalom -->
        <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-1 w-full">
            <!-- Hozzáadó űrlap -->
            <section class="bg-white p-6 rounded-3xl border border-[#f0e6d2] shadow-xl shadow-orange-950/5 h-fit">
                <h2 class="text-xl font-bold font-sims mb-4 text-[#3d322c] border-b border-[#f8f2eb] pb-3 flex items-center gap-2">
                    <span class="text-emerald-600">+</span> Új Sim Hozzáadása
                </h2>
                <form id="simForm" onsubmit="saveSim(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Sim Neve *</label>
                        <input type="text" id="name" required class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Generáció</label>
                            <input type="number" id="generation" value="1" min="1" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Nemesi Cím</label>
                            <input type="text" id="title" placeholder="pl. Gróf" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Szülők</label>
                        <input type="text" id="parents" placeholder="pl. Alexander & Bella" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Portré Kép URL</label>
                        <input type="url" id="avatar_url" placeholder="https://..." class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Megjegyzések / Történet</label>
                        <textarea id="notes" rows="3" placeholder="Főbb életesemények..." class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 transition resize-none"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-2xl transition shadow-md shadow-emerald-600/20 cursor-pointer">
                        Sim Mentése a Családfára
                    </button>
                </form>
            </section>

            <!-- Lista -->
            <section class="lg:col-span-2 space-y-6">
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-[#f0e6d2] shadow-sm">
                    <h2 class="text-xl font-bold font-sims text-[#3d322c]">Dinasztia Tagjai</h2>
                    <span id="simCount" class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold px-3 py-1 rounded-full">0 Sim</span>
                </div>
                
                <div id="simsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="text-[#8c786d] text-center col-span-2 py-12 bg-white/60 rounded-3xl border border-dashed border-[#e6d5bc]">
                        Még nincsenek simek rögzítve.
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Beállítások Modális Ablak -->
    <div id="settingsModal" class="fixed inset-0 bg-[#3d322c]/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white border border-[#e6d5bc] rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-bold font-sims mb-2 text-[#3d322c]">Supabase Csatlakozás</h3>
            <p class="text-xs text-[#7d6b63] mb-6">Add meg a Supabase projekt adatait a kapcsolódáshoz.</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Supabase URL</label>
                    <input type="text" id="supaUrl" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-[#7d6b63] mb-1">Supabase Publishable Key</label>
                    <input type="password" id="supaKey" class="w-full bg-[#fdfbf7] border border-[#e6d5bc] rounded-2xl px-4 py-2.5 text-[#4a403b] focus:outline-none focus:border-emerald-500">
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button onclick="closeSettings()" class="bg-[#f4ebd9] hover:bg-[#eadfc7] text-[#5c4a42] px-5 py-2.5 rounded-2xl text-sm font-semibold cursor-pointer transition">Mégse</button>
                    <button onclick="saveSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-2xl text-sm shadow-md shadow-emerald-600/20 cursor-pointer transition">Mentés</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        let supabaseClient = null;
        let currentUser = null;

        function initApp() {
            const url = localStorage.getItem('supa_url');
            const key = localStorage.getItem('supa_key');
            if (url && key) {
                try {
                    supabaseClient = supabase.createClient(url, key);
                    checkUserSession();
                } catch(e) {
                    openSettings();
                }
            } else {
                openSettings();
            }
        }

        async function checkUserSession() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                const username = currentUser.user_metadata?.username || currentUser.email.split('@')[0];
                document.getElementById('userProfileDisplay').innerText = username;
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('mainView').classList.remove('hidden');
                loadSims();
            } else {
                document.getElementById('mainView').classList.add('hidden');
                document.getElementById('authView').classList.remove('hidden');
            }
        }

        function switchAuthMode(mode) {
            hideMessages();
            if (mode === 'register') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Regisztráció';
                document.getElementById('authSubtitle').innerText = 'Hozz létre fiókot a dinasztiához';
            } else {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Bejelentkezés';
                document.getElementById('authSubtitle').innerText = 'Lépj be a dinasztia kezeléséhez';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessages();
            if (!supabaseClient) { alert('Előbb add meg a Supabase kulcsokat!'); openSettings(); return; }
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showAuthError(error.message);
            } else {
                checkUserSession();
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideMessages();
            if (!supabaseClient) { alert('Előbb add meg a Supabase kulcsokat!'); openSettings(); return; }
            
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            
            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: {
                    data: { username: username }
                }
            });

            if (error) {
                showAuthError(error.message);
            } else {
                showAuthSuccess('Sikeres regisztráció! Most már bejelentkezhetsz.');
                setTimeout(() => {
                    switchAuthMode('login');
                }, 1500);
            }
        }

        async function logout() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            currentUser = null;
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
            document.getElementById('loginForm').reset();
            switchAuthMode('login');
        }

        function showAuthError(msg) {
            const errEl = document.getElementById('authError');
            errEl.innerText = msg;
            errEl.classList.remove('hidden');
        }

        function showAuthSuccess(msg) {
            const succEl = document.getElementById('authSuccess');
            succEl.innerText = msg;
            succEl.classList.remove('hidden');
        }

        function hideMessages() {
            document.getElementById('authError').classList.add('hidden');
            document.getElementById('authSuccess').classList.add('hidden');
        }

        function openSettings() {
            document.getElementById('supaUrl').value = localStorage.getItem('supa_url') || '';
            document.getElementById('supaKey').value = localStorage.getItem('supa_key') || '';
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const url = document.getElementById('supaUrl').value.trim();
            const key = document.getElementById('supaKey').value.trim();
            if (url && key) {
                localStorage.setItem('supa_url', url);
                localStorage.setItem('supa_key', key);
                closeSettings();
                initApp();
            } else {
                alert('Kérlek töltsd ki mindkét mezőt!');
            }
        }

        async function loadSims() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('sims').select('*').order('generation', { ascending: true });
            
            const container = document.getElementById('simsContainer');
            const countEl = document.getElementById('simCount');
            
            if (error) {
                container.innerHTML = `<div class="text-rose-500 col-span-2">Hiba az adatok lekérésekor: ${error.message}</div>`;
                return;
            }

            countEl.innerText = `${data.length} Sim`;

            if (data.length === 0) {
                container.innerHTML = `<div class="text-[#8c786d] text-center col-span-2 py-12 bg-white/60 rounded-3xl border border-dashed border-[#e6d5bc]">Még nincsenek rögzített simek a családfán.</div>`;
                return;
            }

            container.innerHTML = data.map(sim => `
                <div class="bg-white border border-[#f0e6d2] rounded-3xl p-5 shadow-sm hover:shadow-md transition flex gap-4 items-start relative group">
                    <img src="${sim.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150'}" alt="${sim.name}" class="w-16 h-16 rounded-2xl object-cover border border-[#e6d5bc] bg-[#fdfbf7] shrink-0 shadow-inner">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold font-sims text-lg text-[#3d322c] truncate">${sim.name}</h3>
                            <button onclick="deleteSim('${sim.id}')" class="text-[#b09e93] hover:text-rose-500 text-xs p-1 rounded-full transition cursor-pointer" title="Törlés">✕</button>
                        </div>
                        ${sim.title ? `<span class="inline-block bg-amber-50 text-amber-800 border border-amber-200/60 text-xs px-2.5 py-0.5 rounded-full font-semibold mb-1.5">${sim.title}</span>` : ''}
                        <p class="text-xs text-[#7d6b63]">Generáció: <span class="text-[#3d322c] font-bold">${sim.generation}.</span></p>
                        ${sim.parents ? `<p class="text-xs text-[#7d6b63] truncate">Szülők: <span class="text-[#3d322c] font-medium">${sim.parents}</span></p>` : ''}
                        ${sim.notes ? `<p class="text-xs text-[#5c4a42] mt-2 italic bg-[#fdfbf7] p-2.5 rounded-2xl border border-[#f4ebd9]">${sim.notes}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function saveSim(e) {
            e.preventDefault();
            if (!supabaseClient || !currentUser) return;

            const newSim = {
                user_id: currentUser.id,
                name: document.getElementById('name').value,
                generation: parseInt(document.getElementById('generation').value) || 1,
                title: document.getElementById('title').value,
                parents: document.getElementById('parents').value,
                avatar_url: document.getElementById('avatar_url').value,
                notes: document.getElementById('notes').value
            };

            const { error } = await supabaseClient.from('sims').insert([newSim]);
            if (error) {
                alert('Hiba mentés közben: ' + error.message);
            } else {
                document.getElementById('simForm').reset();
                loadSims();
            }
        }

        async function deleteSim(id) {
            if (confirm('Biztosan törlöd ezt a simet?')) {
                const { error } = await supabaseClient.from('sims').delete().eq('id', id);
                if (error) {
                    alert('Hiba törlés közben: ' + error.message);
                } else {
                    loadSims();
                }
            }
        }

        // Indulás
        initApp();
    </script>
</body>
</html>
