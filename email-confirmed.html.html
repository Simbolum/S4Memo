<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>E-mail-cím megerősítve | S4Memo</title>
  <style>
    :root {
      --pink: #f4dce2;
      --cream: #fff8ed;
      --beige: #e9d8c5;
      --green: #4e9a55;
      --green-dark: #28663c;
      --ink: #51483f;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 15%, rgba(244,220,226,.95), transparent 42%),
        radial-gradient(ellipse at 85% 80%, rgba(233,216,197,.9), transparent 45%),
        linear-gradient(135deg, #fff8ed 0%, #f8e9e6 48%, #f1e4d4 100%);
    }
    .card {
      width: min(100%, 520px);
      padding: clamp(30px, 7vw, 54px) 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 30px;
      background: rgba(255, 252, 246, .82);
      box-shadow: 0 22px 65px rgba(114, 81, 74, .13);
      backdrop-filter: blur(8px);
      animation: arrive .65s ease-out both;
    }
    .plumbob-wrap {
      width: 124px;
      height: 145px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 12px 17px rgba(58, 135, 71, .24));
    }
    .plumbob {
      width: 100px;
      height: 132px;
      overflow: visible;
      transform-origin: 50% 50%;
      animation: plumbob-spin 7s linear infinite;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #7d8c69;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #3d7549;
      font-size: clamp(1.8rem, 6vw, 2.45rem);
      line-height: 1.15;
      letter-spacing: -.035em;
    }
    .message {
      max-width: 350px;
      margin: 18px auto 27px;
      font-size: 1rem;
      line-height: 1.7;
      color: #76685e;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 25px;
      border-radius: 999px;
      color: #fffdf7;
      background: linear-gradient(135deg, #559d5c, #347a49);
      box-shadow: 0 8px 20px rgba(62, 129, 73, .2);
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 11px 24px rgba(62,129,73,.25); }
    .footer { margin: 26px 0 0; color: #a09183; font-size: .8rem; letter-spacing: .04em; }
    .sparkle { position: fixed; color: rgba(104, 145, 92, .45); pointer-events: none; font-size: 20px; }
    .s1 { top: 16%; left: 14%; } .s2 { top: 24%; right: 16%; font-size: 15px; }
    .s3 { bottom: 17%; left: 19%; font-size: 14px; } .s4 { bottom: 24%; right: 13%; }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes plumbob-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .plumbob { animation: none; }
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <span class="sparkle s1" aria-hidden="true">✦</span>
  <span class="sparkle s2" aria-hidden="true">✧</span>
  <span class="sparkle s3" aria-hidden="true">✧</span>
  <span class="sparkle s4" aria-hidden="true">✦</span>
  <main class="card">
    <div class="plumbob-wrap" aria-label="Zöld Sims ihlette plumbob embléma" role="img">
      <svg class="plumbob" viewBox="0 0 100 132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a8e878"/>
            <stop offset=".42" stop-color="#5cbd62"/>
            <stop offset="1" stop-color="#28764a"/>
          </linearGradient>
          <linearGradient id="facet" x1="0" y1="0" x2="0.9" y2="1">
            <stop offset="0" stop-color="#e0ffad"/>
            <stop offset="1" stop-color="#76ce72"/>
          </linearGradient>
        </defs>
        <path d="M50 3 L91 65.5 L50 128 L9 65.5 Z" fill="url(#gem)" stroke="#347d45" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M50 3 L50 128 L9 65.5 Z" fill="#b4ef7e" opacity=".72"/>
        <path d="M50 3 L91 65.5 L50 128 Z" fill="#25814b" opacity=".43"/>
        <path d="M9 65.5 L91 65.5 L50 128 Z" fill="#4eaa59" opacity=".6"/>
        <path d="M50 3 L34 65.5 L9 65.5 Z" fill="url(#facet)" opacity=".95"/>
        <path d="M50 3 L66 65.5 L91 65.5 Z" fill="#69c86a" opacity=".9"/>
        <path d="M34 65.5 L50 128 L50 3 Z" fill="#d6ff9b" opacity=".28"/>
        <path d="M27 27 L39 15" stroke="#efffd3" stroke-width="4" stroke-linecap="round" opacity=".75"/>
      </svg>
    </div>
    <p class="eyebrow">S4Memo · sikeres megerősítés</p>
    <h1>E-mail-cím<br>megerősítve!</h1>
    <p class="message">Szuper, minden rendben! Az e-mail-címed megerősítése sikerült. Most már visszatérhetsz a S4Memo világába.</p>
    <a class="button" href="./">Vissza a S4Memo oldalra <span aria-hidden="true" style="margin-left:9px">→</span></a>
    <p class="footer">Egy kis varázslat a Sims-életekhez ♡</p>
  </main>
</body>
</html>
